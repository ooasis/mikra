name: Mikra
options:
  bundleIdPrefix: com.ooasis
targets:
  Mikra:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Mikra]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ooasis.mikra
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 263U684LP7
        INFOPLIST_KEY_CFBundleDisplayName: Mikra
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: 7
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Mikra records your voice so you can hear yourself read a verse.
